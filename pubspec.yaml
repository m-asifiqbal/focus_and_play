name: focus_and_play_mindgame
description: "Mind Isles — an offline puzzle game: four islands, four puzzles, easy to expert."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State + navigation (same stack as FocusFlow: Riverpod without codegen, go_router).
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.2

  # Storage, files and dates.
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  intl: ^0.20.2
  package_info_plus: ^10.2.2

  # Look and feel.
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  audioplayers: ^6.8.1

  # Reminders.
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1

  # The only network use: AdMob (banner, interstitial, rewarded) + its consent form.
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/licenses/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
